<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شاصيها | لوحة الإدارة</title>


<style>

*{
box-sizing:border-box;
}


body{

font-family:Cairo,Arial,sans-serif;

background:#f3f4f6;

margin:0;

padding:20px;

color:#333;

}


.container{

max-width:1100px;

margin:auto;

}



.header{

background:linear-gradient(135deg,#f97316,#ea580c);

color:white;

padding:25px;

border-radius:25px;

text-align:center;

box-shadow:0 8px 20px #ddd;

}



.header h1{

margin:0;

font-size:32px;

}


.header p{

font-size:18px;

}



.cards{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-top:25px;

}



.card{

background:white;

padding:25px;

border-radius:22px;

text-align:center;

box-shadow:0 5px 15px #ddd;

transition:.3s;

}


.card:hover{

transform:translateY(-5px);

}



.card h3{

color:#f97316;

margin:0;

font-size:18px;

}



.number{

font-size:38px;

font-weight:bold;

margin-top:15px;

color:#111827;

}



.section{

background:white;

padding:25px;

border-radius:22px;

margin-top:25px;

box-shadow:0 5px 15px #ddd;

}



.searchBox input{

width:100%;

padding:15px;

border-radius:15px;

border:1px solid #ddd;

font-size:17px;

}



.menu{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(180px,1fr));

gap:15px;

margin-top:20px;

}



.menu button{

background:#111827;

color:white;

border:0;

padding:18px;

border-radius:15px;

font-size:16px;

font-weight:bold;

cursor:pointer;

}



.menu button:hover{

background:#f97316;

}
</style>

</head>


<body>


<div class="container">


<div class="header">

<h1>🚗 شاصيها</h1>

<h2>لوحة إدارة مغسلة السيارات</h2>

<p id="welcome"></p>

</div>



<div class="cards">


<div class="card">

<h3>👥 عدد المشتركين</h3>

<div class="number" id="totalMembers">
0
</div>

</div>



<div class="card">

<h3>🚿 غسلات اليوم</h3>

<div class="number" id="todayWash">
0
</div>

</div>



<div class="card">

<h3>💰 دخل الشهر</h3>

<div class="number" id="monthlyIncome">
0
</div>

</div>



<div class="card">

<h3>⚠️ اشتراكات منتهية</h3>

<div class="number" id="expired">
0
</div>

</div>


</div>





<div class="section searchBox">

<h3>🔍 بحث سريع</h3>


<input 
type="text"
id="search"
placeholder="ابحث بالاسم أو رقم السيارة أو رقم العضوية">


</div>





<div class="section">


<h3>⚡ الاختصارات</h3>


<div class="menu">


<button onclick="window.location.href='https://shassiha.github.io/shassiha-wash/add-member.html'">
➕ إضافة مشترك
</button>

<button onclick="window.location.href='https://shassiha.github.io/shassiha-wash/members.html'">
👥 جميع المشتركين
</button>


<button onclick="window.location.href='https://shassiha.github.io/shassiha-wash/washes.html'">
🚿 سجل الغسلات
</button>


<button onclick="window.location.href='https://shassiha.github.io/shassiha-wash/reports.html'">
📊 التقارير
</button>

</div>


</div>






<div class="section">


<h3>
🚿 آخر الغسلات
</h3>



<div style="overflow:auto">


<table width="100%" id="washTable">


<tr>

<th>
العضوية
</th>


<th>
الاسم
</th>


<th>
السيارة
</th>


<th>
التاريخ
</th>


</tr>



<tr>

<td colspan="4">
لا توجد بيانات
</td>

</tr>



</table>


</div>



</div>






<div class="section">


<h3>
👥 المشتركين
</h3>


<div style="overflow:auto">


<table width="100%" id="membersTable">


<tr>


<th>
العضوية
</th>


<th>
الاسم
</th>


<th>
السيارة
</th>


<th>
الاشتراك
</th>


<th>
المتبقي
</th>


<th>
الحالة
</th>

<th>
الإجراء
</th>

</tr>



<tr>

<td colspan="6">
جاري تحميل البيانات...
</td>

</tr>


</table>



</div>


</div>
<script>


// رسالة الترحيب

let hour = new Date().getHours();

let welcome = "";

if(hour < 12){

welcome = "صباح الخير ☀️";

}else if(hour < 18){

welcome = "مساء الخير 🌤️";

}else{

welcome = "مساء الخير 🌙";

}


document.getElementById("welcome").innerHTML =
welcome + " أيهم";





// رابط الـ API

const api =
"https://script.google.com/macros/s/AKfycbyhSUO41n1mWPabPWy0yX3FbUenKBhZgrDONzDVWd3m0YhP_APInJCKJSsXjysNQ2Tn/exec";





// تحميل البيانات لاحقاً

async function loadDashboard(){

try{


let response = await fetch(
api + "?action=getDashboard"
);


let data = await response.json();



if(data.status=="success"){



document.getElementById("totalMembers").innerHTML =
data.totalMembers;



document.getElementById("todayWash").innerHTML =
data.todayWash;



document.getElementById("expired").innerHTML =
data.expired;



// آخر الغسلات

let table =
document.getElementById("washTable");


table.innerHTML = `

<tr>

<th>العضوية</th>

<th>الاسم</th>

<th>السيارة</th>

<th>التاريخ</th>

</tr>

`;



data.lastWash.forEach(function(item){


table.innerHTML += `

<tr>

<td>${item.memberId}</td>

<td>${item.name}</td>

<td>${item.car}</td>

<td>${item.date}</td>

</tr>

`;

});


}


}catch(error){

console.log(error);

}


}


// البحث

document.getElementById("search")
.addEventListener("keyup",function(){


let value=this.value.toLowerCase();


let rows=document.querySelectorAll(
"#membersTable tr"
);



rows.forEach(function(row){


if(row.innerText.toLowerCase()
.includes(value)){


row.style.display="";


}else{


row.style.display="none";


}



});


});

async function loadMembers(){

let response = await fetch(
api + "?action=getMembers"
);

let data = await response.json();

if(data.status!="success") return;

let table =
document.getElementById("membersTable");

table.innerHTML = `

<tr>

<th>العضوية</th>

<th>الاسم</th>

<th>السيارة</th>

<th>الاشتراك</th>

<th>المتبقي</th>

<th>الحالة</th>

</tr>

`;

data.members.forEach(function(item){

table.innerHTML += `

<tr>

<td>${item.memberId}</td>

<td>${item.name}</td>

<td>${item.car}</td>

<td>${item.plan}</td>

<td>${item.remaining}</td>

<td>

<span style="
padding:6px 12px;
border-radius:20px;
font-weight:bold;
color:white;
background:${item.status=="فعال" ? "#16a34a" : "#dc2626"};
">

${item.status}

</span>

</td>
<td>

<a href="https://shassiha.github.io/shassiha-wash/car.html?id=${item.memberId}" target="_blank">

👁️ عرض

</a>

</td>
<td>

<button onclick="renew('${item.memberId}')">
🔄 تجديد
</button>

</td>
</tr>

`;

});

}
function renew(memberId){

let plan = prompt(
"اكتب عدد الغسلات الجديدة (4 أو 5 أو 6)"
);


if(!plan){
return;
}


fetch(
api +
"?action=renewSubscription" +
"&memberId=" +
memberId +
"&plan=" +
plan
)

.then(res=>res.json())

.then(data=>{


if(data.status=="success"){


alert("تم تجديد الاشتراك بنجاح ✅");


loadMembers();


}else{


alert("حدث خطأ");


}


});


}
loadDashboard();
loadMembers();

</script>


</div>


</body>

</html>
