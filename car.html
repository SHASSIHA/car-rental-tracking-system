<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بيانات السيارة - محطة الغسل</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">

<style>

body{
font-family:'Cairo',sans-serif;
background:#f2f2f2;
padding:20px;
text-align:center;
}

.box{
background:white;
max-width:420px;
margin:auto;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px #ccc;
}

h1{
font-size:24px;
}

.info{
background:#fafafa;
padding:15px;
border-radius:10px;
line-height:2;
font-size:18px;
}

button{
width:100%;
padding:12px;
margin-top:15px;
border:0;
border-radius:8px;
background:#0f172a;
color:white;
font-size:16px;
font-weight:bold;
}

.success{
color:green;
font-weight:bold;
}

</style>

</head>


<body>


<div class="box">

<h1>
🚗 شاصيها - محطة الغسل
</h1>


<div class="info">

<div>
اسم الساكن:
<br>
<b id="name"></b>
</div>

<hr>

<div>
رقم الشقة:
<br>
<b id="flat"></b>
</div>

<hr>

<div>
رقم السيارة:
<br>
<b id="car"></b>
</div>

<hr>

<div>
نوع السيارة:
<br>
<b id="type"></b>
</div>

<hr>

<div>
آخر غسلة:
<br>
<b id="lastWash">لا توجد</b>
</div>

</div>


<button onclick="addWash()">
🧽 تسجيل غسلة جديدة
</button>


<div id="msg"></div>


</div>



<script>


let params = new URLSearchParams(window.location.search);

let id = params.get("id");


let data = JSON.parse(
localStorage.getItem("car_"+id)
);


if(data){

document.getElementById("name").innerText=data.name;

document.getElementById("flat").innerText=data.flat;

document.getElementById("car").innerText=data.car;

document.getElementById("type").innerText=data.type;


}else{

document.querySelector(".info").innerHTML =
"❌ السيارة غير موجودة";

}



function addWash(){


let now = new Date();


let date =
now.toLocaleDateString("ar-IQ");


localStorage.setItem(
"wash_"+id,
date
);


document.getElementById("lastWash").innerText=date;


document.getElementById("msg").innerHTML =
"<p class='success'>تم تسجيل الغسلة ✅</p>";

}



let last =
localStorage.getItem("wash_"+id);


if(last){

document.getElementById("lastWash").innerText=last;

}


</script>


</body>

</html>
