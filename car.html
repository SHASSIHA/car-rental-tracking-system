<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شاصيها | بيانات السيارة</title>

<style>

body{
font-family:Cairo,Arial;
background:#f2f2f2;
padding:20px;
text-align:center;
}

.box{
background:white;
max-width:400px;
margin:auto;
padding:25px;
border-radius:20px;
box-shadow:0 5px 15px #ccc;
}

h2{
color:#f97316;
}

.data{
text-align:right;
line-height:2;
font-size:18px;
}

button{

width:100%;
padding:14px;
margin-top:20px;
background:#f97316;
color:white;
border:0;
border-radius:10px;
font-size:17px;
font-weight:bold;

}

</style>

</head>


<body>


<div class="box">


<h2>
🚗 بيانات السيارة
</h2>


<div id="info">
جاري تحميل البيانات...
</div>


<button onclick="wash()">
🚿 تسجيل غسلة جديدة
</button>


</div>




<script>


let params = new URLSearchParams(location.search);

let id = params.get("id");



let api =
"https://script.google.com/macros/s/AKfycbwv5yHgj_--OYdVPk0uxVPtysOflgcmRSM8LY2pon_zgHjgUsxQ3PpDHK5MvqaeQzKy/exec";

async function loadCar(){


let url = api +

"?action=getCar&id="

+id;



let response = await fetch(url);


let data = await response.json();



if(data.status=="success"){



document.getElementById("info").innerHTML =

`
<div class="data">

<b>رقم العضوية:</b> ${data.memberId}<br>

<b>اسم الساكن:</b> ${data.name}<br>

<b>رقم الشقة:</b> ${data.flat}<br>

<b>رقم الهاتف:</b> ${data.phone}<br>

<b>السيارة:</b> ${data.car}<br>

<b>النوع:</b> ${data.type}

</div>
`;



}else{


document.getElementById("info").innerHTML=
"السيارة غير موجودة";


}



}



function wash(){

alert("سيتم إضافة تسجيل الغسلة بالخطوة القادمة");

}



loadCar();



</script>


</body>

</html>
