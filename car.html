<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شاصيها | بيانات السيارة</title>

<style>

body{
font-family:Cairo,Arial;
background:#f2f2f2;
padding:20px;
text-align:center;
}

.box{
background:white;
max-width:400px;
margin:auto;
padding:25px;
border-radius:20px;
box-shadow:0 5px 15px #ccc;
}

h2{
color:#f97316;
}

.data{
text-align:right;
line-height:2;
font-size:18px;
}

button{

width:100%;
padding:14px;
margin-top:20px;
background:#f97316;
color:white;
border:0;
border-radius:10px;
font-size:17px;
font-weight:bold;

}

</style>

</head>


<body>


<div class="box">


<h2>
🚗 بيانات السيارة
</h2>


<div id="info">
جاري تحميل البيانات...
</div>


<button onclick="wash()">
🚿 تسجيل غسلة جديدة
</button>


</div>




<script>


let params = new URLSearchParams(location.search);

let id = params.get("id");

let carData = {};


// رابط جلب البيانات
let api =
"https://script.google.com/macros/s/AKfycbyZAef3gfucTmU-Vf4JTqutgLNzQrT_tzkjrm55t5YMLzWxh421wF-mm3vLT0Q6gxtO/exec";


// تحميل بيانات السيارة

async function loadWashStats(){


let url = api +

"?action=getWashStats&memberId=" + id;


let response = await fetch(url);

let data = await response.json();


if(data.status=="success"){

document.getElementById("washCount").innerHTML = data.count;

document.getElementById("lastWash").innerHTML = data.lastDate || "-";

}


}



// تسجيل الغسلة

async function wash(){


if(!carData.car){

alert("انتظر تحميل بيانات السيارة");

return;

}



let washApi =
"https://script.google.com/macros/s/AKfycbyZAef3gfucTmU-Vf4JTqutgLNzQrT_tzkjrm55t5YMLzWxh421wF-mm3vLT0Q6gxtO/exec";

let url = washApi +

"?action=addWash" +

"&memberId=" + encodeURIComponent(carData.memberId) +

"&car=" + encodeURIComponent(carData.car) +

"&name=" + encodeURIComponent(carData.name);



try{


let response = await fetch(url);


let result = await response.json();



if(result.status=="success"){


alert("✅ تم تسجيل الغسلة بنجاح");


}else{


alert("❌ لم يتم التسجيل");


}


}

catch(error){

alert("حدث خطأ بالاتصال");

}


}




loadCar();
loadWashStats();

</script>


</body>

</html>
