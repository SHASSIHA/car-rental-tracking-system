<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شاصيها | بيانات السيارة</title>

<style>

body{
font-family:Cairo,Arial,sans-serif;
background:#f2f2f2;
padding:20px;
text-align:center;
}

.box{
background:#fff;
max-width:420px;
margin:auto;
padding:25px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

h2{
color:#f97316;
margin-bottom:20px;
}

.data{
text-align:right;
line-height:2;
font-size:18px;
}

button{
width:100%;
padding:14px;
margin-top:20px;
background:#f97316;
color:#fff;
border:0;
border-radius:10px;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

button:disabled{
background:#999;
}

</style>

</head>

<body>

<div class="box">

<h2>🚗 بيانات السيارة</h2>

<div id="info">
جاري تحميل البيانات...
</div>

<button id="washBtn" onclick="wash()" disabled>
🚿 تسجيل غسلة جديدة
</button>

</div>

<script>

const api =
"https://script.google.com/macros/s/AKfycbyZAef3gfucTmU-Vf4JTqutgLNzQrT_tzkjrm55t5YMLzWxh421wF-mm3vLT0Q6gxtO/exec";

const params = new URLSearchParams(window.location.search);

const memberId = params.get("id");

let carData = null;



async function loadCar(){

if(!memberId){

document.getElementById("info").innerHTML="رقم العضوية غير موجود";

return;

}

try{

const response = await fetch(
api + "?action=getCar&id=" + encodeURIComponent(memberId)
);

const data = await response.json();

if(data.status!="success"){

document.getElementById("info").innerHTML="السيارة غير موجودة";

return;

}

carData=data;

document.getElementById("info").innerHTML=`

<div class="data">

<b>رقم العضوية:</b> ${data.memberId}<br>

<b>اسم الساكن:</b> ${data.name}<br>

<b>رقم الشقة:</b> ${data.flat}<br>

<b>رقم الهاتف:</b> ${data.phone}<br>

<b>السيارة:</b> ${data.car}<br>

<b>النوع:</b> ${data.type}<br><br>

<b>🚿 عدد الغسلات:</b> <span id="washCount">جاري الحساب...</span><br>

<b>📅 آخر غسلة:</b> <span id="lastWash">-</span>

</div>
`;

document.getElementById("washBtn").disabled=false;

}catch(err){

document.getElementById("info").innerHTML="تعذر الاتصال بالخادم";

console.log(err);

}

}



async function wash(){

if(!carData) return;

document.getElementById("washBtn").disabled=true;

try{

const response = await fetch(

api +
"?action=addWash" +
"&memberId="+encodeURIComponent(carData.memberId) +
"&car="+encodeURIComponent(carData.car) +
"&name="+encodeURIComponent(carData.name)

);

const result=await response.json();

if(result.status=="success"){

alert("✅ تم تسجيل الغسلة بنجاح");

}else{

alert("❌ فشل تسجيل الغسلة");

}

}catch(err){

alert("حدث خطأ بالاتصال");

console.log(err);

}

document.getElementById("washBtn").disabled=false;

}

async function loadWashStats(){

try{

const response = await fetch(
api + "?action=getWashStats&memberId=" + encodeURIComponent(memberId)
);

const data = await response.json();


if(data.status=="success"){

document.getElementById("washCount").innerHTML = data.count;

if(data.lastDate){

let date = new Date(data.lastDate);

document.getElementById("lastWash").innerHTML =
date.toLocaleDateString("ar-IQ");

}else{

document.getElementById("lastWash").innerHTML="-";

}

}

}catch(error){

console.log(error);

}

}
loadCar().then(()=>{
  loadWashStats();
});
</script>

</body>
</html>
