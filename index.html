<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شاصيها | محطة الغسل</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

body{
font-family:Cairo,Arial;
background:#f2f2f2;
padding:20px;
text-align:center;
}

.box{
background:#fff;
max-width:420px;
margin:auto;
padding:25px;
border-radius:20px;
box-shadow:0 5px 15px #ccc;
}

h2{
margin-bottom:20px;
}

input,button{

width:100%;
padding:13px;
margin:7px 0;
font-size:16px;
border-radius:10px;

}

input{
border:1px solid #ccc;
}

button{

background:#f97316;
color:white;
border:0;
font-weight:bold;
cursor:pointer;

}

button:hover{
opacity:.9;
}


#qrcode{

margin-top:20px;

}

.result{

margin-top:15px;
font-weight:bold;

}

</style>

</head>


<body>


<div class="box">


<h2>
🚗 تسجيل سيارة جديدة
</h2>


<input id="name" placeholder="اسم الساكن">

<input id="flat" placeholder="رقم الشقة">

<input id="phone" placeholder="رقم الهاتف">

<input id="car" placeholder="رقم السيارة">

<input id="type" placeholder="نوع السيارة">
<label style="display:block;text-align:right;margin-top:10px;">
📦 نوع الاشتراك
</label>

<select id="plan" style="width:100%;padding:12px;font-size:16px;margin-top:5px;">
<option value="0">بدون اشتراك</option>
<option value="4">اشتراك 4 غسلات</option>
<option value="5">اشتراك 5 غسلات</option>
<option value="6">اشتراك 6 غسلات</option>
</select>

<button onclick="createQR()">

إنشاء بطاقة السيارة QR

</button>


<div class="result" id="result"></div>


<div id="qrcode"></div>


</div>




<script>


async function createQR(){


let name=document.getElementById("name").value;
let flat=document.getElementById("flat").value;
let phone=document.getElementById("phone").value;
let car=document.getElementById("car").value;
let type=document.getElementById("type").value;
alert("الاشتراك المختار: " + plan);
  let plan=document.getElementById("plan").value;
  
if(!name || !car){

alert("يرجى إدخال اسم الساكن ورقم السيارة");

return;

}



let api =

"https://script.google.com/macros/s/AKfycbyRijfuD8GhzlVp3-b3dvapDhduXNff9h0rg8lyzT1pZ9T5sy5BdPi6gtatnahGb4lF/exec";

let url = api +

"?action=addCar" +

"&name="+encodeURIComponent(name)+

"&flat="+encodeURIComponent(flat)+

"&phone="+encodeURIComponent(phone)+

"&car="+encodeURIComponent(car)+

"&type="+encodeURIComponent(type)+

"&color=" +

"&plan="+encodeURIComponent(plan);
  
let response = await fetch(url);


let data = await response.json();



if(data.status=="success"){



let memberId=data.memberId;



let qrLink =

"https://shassiha.github.io/shassiha-wash/car.html?id="

+memberId;



document.getElementById("qrcode").innerHTML="";



new QRCode(

document.getElementById("qrcode"),

{

text:qrLink,

width:180,

height:180

}

);



document.getElementById("result").innerHTML=

"رقم العضوية: "+memberId;



}else{


alert("حدث خطأ");

}



}



</script>


</body>

</html>
