<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إدارة محطة الغسل</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{
font-family:Cairo,Arial;
background:#f2f2f2;
padding:20px;
text-align:center;
}

.box{
background:white;
max-width:400px;
margin:auto;
padding:20px;
border-radius:15px;
}

input,button{
width:100%;
padding:12px;
margin:6px 0;
font-size:16px;
}

button{
background:#0f172a;
color:white;
border:0;
border-radius:8px;
}

#qrcode{
margin-top:20px;
}
</style>

</head>

<body>

<div class="box">

<h2>🚗 تسجيل سيارة جديدة</h2>

<input id="name" placeholder="اسم الساكن">

<input id="flat" placeholder="رقم الشقة">

<input id="phone" placeholder="رقم الهاتف">

<input id="car" placeholder="رقم السيارة">

<input id="type" placeholder="نوع السيارة">

<button onclick="createQR()">
إنشاء QR
</button>


<div id="qrcode"></div>


</div>


<script>

function createQR(){

let id = Date.now();


let data = {
name:document.getElementById("name").value,
flat:document.getElementById("flat").value,
phone:document.getElementById("phone").value,
car:document.getElementById("car").value,
type:document.getElementById("type").value
};


localStorage.setItem(
"car_"+id,
JSON.stringify(data)
);


let link =
"https://shassiha.github.io/car-rental-tracking-system/car.html?id="+id;

document.getElementById("qrcode").innerHTML="";


async function createQR(){

let name=document.getElementById("name").value;
let flat=document.getElementById("flat").value;
let phone=document.getElementById("phone").value;
let car=document.getElementById("car").value;
let type=document.getElementById("type").value;


let api =
"https://script.google.com/macros/s/AKfycbyRijfuD8GhzlVp3-b3dvapDhduXNff9h0rg8lyzT1pZ9T5sy5BdPi6gtatnahGb4lF/exec";


let url = api +
"?action=addCar" +
"&name="+encodeURIComponent(name)+
"&flat="+encodeURIComponent(flat)+
"&phone="+encodeURIComponent(phone)+
"&car="+encodeURIComponent(car)+
"&type="+encodeURIComponent(type)+
"&color=";


let response = await fetch(url);

let result = await response.json();


let link =
"https://shassiha.github.io/car-rental-tracking-system/car.html?id="
+result.memberId;


document.getElementById("qrcode").innerHTML="";


new QRCode(
document.getElementById("qrcode"),
{
text:link,
width:150,
height:150
}
);


alert("تم إنشاء السيارة برقم: "+result.memberId);

}

</script>

</body>
</html>
