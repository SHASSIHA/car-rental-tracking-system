<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شاصيها | جميع المشتركين</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box;
}

body{

font-family:'Cairo',sans-serif;
background:#f3f4f6;
margin:0;
padding:20px;

}


.container{

max-width:1100px;
margin:auto;

}


.header{

background:linear-gradient(135deg,#f97316,#ea580c);
color:white;
padding:25px;
border-radius:22px;
text-align:center;

}


.header h1{

margin:0;

}



.search{

background:white;
margin-top:20px;
padding:20px;
border-radius:20px;
box-shadow:0 5px 15px #ddd;

}


.search input{

width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;

}



.table-box{

background:white;
margin-top:20px;
padding:20px;
border-radius:20px;
box-shadow:0 5px 15px #ddd;

overflow:auto;

}



table{

width:100%;
border-collapse:collapse;

}



th{

background:#111827;
color:white;
padding:12px;

}



td{

padding:12px;
border-bottom:1px solid #eee;
text-align:center;

}



.status{

padding:5px 12px;
border-radius:20px;
color:white;
font-weight:bold;

}



.active{

background:#16a34a;

}



.expired{

background:#dc2626;

}



.btn{

border:0;
padding:8px 12px;
border-radius:8px;
cursor:pointer;
font-weight:bold;

}


.view{

background:#f97316;
color:white;

}


.print{

background:#111827;
color:white;

}



</style>

</head>


<body>


<div class="container">


<div class="header">

<h1>👥 جميع المشتركين</h1>

<p>إدارة مشتركي مغسلة شاصيها</p>

</div>



<div class="search">

<input 
id="search"
placeholder="🔍 ابحث بالاسم أو السيارة أو رقم العضوية">

</div>



<div class="table-box">


<table id="membersTable">


<tr>

<th>العضوية</th>

<th>الاسم</th>

<th>السيارة</th>

<th>الاشتراك</th>

<th>المتبقي</th>

<th>الحالة</th>

<th>إجراء</th>

</tr>


</table>


</div>
  


</div>
<script>

const api =
"https://script.google.com/macros/s/AKfycbyhSUO41n1mWPabPWy0yX3FbUenKBhZgrDONzDVWd3m0YhP_APInJCKJSsXjysNQ2Tn/exec";


let allMembers = [];


async function loadMembers(){


try{


let response = await fetch(
api + "?action=getMembers"
);


let data = await response.json();


if(data.status=="success"){


allMembers = data.members;

displayMembers(allMembers);


}



}catch(error){

console.log(error);

}


}



function displayMembers(list){


let table =
document.getElementById("membersTable");



table.innerHTML = `

<tr>

<th>العضوية</th>

<th>الاسم</th>

<th>السيارة</th>

<th>الاشتراك</th>

<th>المتبقي</th>

<th>الحالة</th>

<th>إجراء</th>

</tr>

`;



list.forEach(function(item){


let statusClass =
item.status=="فعال"
?
"active"
:
"expired";



table.innerHTML += `

<tr>

<td>${item.memberId}</td>

<td>${item.name}</td>

<td>${item.car}</td>

<td>${item.plan==0 ? "بدون اشتراك" : item.plan+" غسلات"}</td>

<td>${item.remaining}</td>


<td>

<span class="status ${statusClass}">

${item.status}

</span>

</td>


<td>


<button class="btn view"
onclick="openCar('${item.memberId}')">

👁️ عرض

</button>



<button class="btn print"
onclick="printSticker('${item.memberId}')">

🖨️ طباعة

</button>


</td>


</tr>

`;


});


}




function openCar(id){

window.open(

"https://shassiha.github.io/shassiha-wash/car.html?id="+id,

"_blank"

);

}




function printSticker(id){


window.open(

"https://shassiha.github.io/shassiha-wash/print.html?id="+id,

"_blank"

);


}





document.getElementById("search")
.addEventListener("keyup",function(){



let value =
this.value.toLowerCase();



let result =
allMembers.filter(function(item){



return (

String(item.memberId)
.toLowerCase()
.includes(value)

||

String(item.name)
.toLowerCase()
.includes(value)

||

String(item.car)
.toLowerCase()
.includes(value)


);



});



displayMembers(result);



});



loadMembers();


</script>


</body>

</html>
