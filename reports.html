<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شاصيها | التقارير</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box;
}

body{

font-family:'Cairo',sans-serif;
background:#f3f4f6;
padding:20px;
margin:0;

}


.container{

max-width:1100px;
margin:auto;

}


.header{

background:linear-gradient(135deg,#f97316,#ea580c);
color:white;
padding:25px;
border-radius:22px;
text-align:center;

}


.header h1{

margin:0;

}



.cards{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:25px;

}



.card{

background:white;
padding:25px;
border-radius:20px;
text-align:center;
box-shadow:0 5px 15px #ddd;

}



.card h3{

color:#f97316;
margin:0;

}



.number{

font-size:40px;
font-weight:800;
margin-top:15px;
color:#111827;

}



.section{

background:white;
padding:25px;
border-radius:20px;
margin-top:25px;
box-shadow:0 5px 15px #ddd;

}



table{

width:100%;
border-collapse:collapse;

}



th{

background:#111827;
color:white;
padding:12px;

}



td{

padding:12px;
text-align:center;
border-bottom:1px solid #eee;

}



</style>

</head>


<body>


<div class="container">


<div class="header">

<h1>📊 تقارير شاصيها</h1>

<p>متابعة أداء المغسلة</p>

</div>



<div class="cards">


<div class="card">

<h3>👥 عدد المشتركين</h3>

<div class="number" id="members">
0
</div>

</div>



<div class="card">

<h3>🚿 مجموع الغسلات</h3>

<div class="number" id="washes">
0
</div>

</div>



<div class="card">

<h3>📅 غسلات اليوم</h3>

<div class="number" id="today">
0
</div>

</div>


</div>



<div class="section">

<h2>🏆 أكثر المشتركين استخداماً</h2>


<table id="topTable">


<tr>

<th>
العضوية
</th>

<th>
الاسم
</th>

<th>
عدد الغسلات
</th>

</tr>


</table>


</div>


</div>



<script>


const api =
"https://script.google.com/macros/s/AKfycbyhSUO41n1mWPabPWy0yX3FbUenKBhZgrDONzDVWd3m0YhP_APInJCKJSsXjysNQ2Tn/exec";



async function loadReports(){


try{


let response = await fetch(
api+"?action=getReports"
);


let data = await response.json();



if(data.status=="success"){


document.getElementById("members").innerHTML =
data.members;



document.getElementById("washes").innerHTML =
data.totalWashes;



document.getElementById("today").innerHTML =
data.today;



let table =
document.getElementById("topTable");



data.top.forEach(function(item){


table.innerHTML += `

<tr>

<td>${item.memberId}</td>

<td>${item.name}</td>

<td>${item.count}</td>

</tr>

`;



});


}


}catch(e){

console.log(e);

}


}


loadReports();


</script>


</body>

</html>
