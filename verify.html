<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>التحقق من العقد</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">

<style>

body{
font-family:Cairo,sans-serif;
background:#f2f2f2;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.card{

background:white;
padding:35px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
text-align:center;
width:420px;

}

.ok{

font-size:70px;
color:#16a34a;

}

.title{

font-size:28px;
font-weight:800;
margin:10px 0;

}

.info{

font-size:18px;
margin:8px 0;

}

.status{

margin-top:20px;
background:#16a34a;
color:white;
padding:10px;
border-radius:8px;
font-weight:bold;

}

</style>

</head>

<body>

<div class="card">

<div class="ok">✔</div>

<div class="title">
نسخة أصلية
</div>

<div class="info" id="contractNo"></div>

<div class="info">
تاريخ العقد:
<span id="contractDate"></span>
</div>

<div class="status">
هذا العقد صحيح وتم إنشاؤه بواسطة شاصيها
</div>

</div>

<script>

const params = new URLSearchParams(location.search);

const id=params.get("id");

const date=params.get("date");

document.getElementById("contractNo").innerHTML=
"رقم العقد: <b>"+id+"</b>";

document.getElementById("contractDate").innerHTML=date;

</script>

</body>

</html>
