<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شاصيها | سجل الغسلات</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box;
}


body{

font-family:'Cairo',sans-serif;
background:#f3f4f6;
margin:0;
padding:20px;

}



.container{

max-width:1100px;
margin:auto;

}



.header{

background:linear-gradient(135deg,#f97316,#ea580c);
color:white;
padding:25px;
border-radius:22px;
text-align:center;

}


.header h1{

margin:0;
font-size:30px;

}



.cards{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:20px;

}



.card{

background:white;
padding:20px;
border-radius:20px;
text-align:center;
box-shadow:0 5px 15px #ddd;

}



.card h3{

color:#f97316;
margin:0;

}



.number{

font-size:35px;
font-weight:bold;
margin-top:10px;

}



.search{

background:white;
padding:20px;
border-radius:20px;
margin-top:20px;
box-shadow:0 5px 15px #ddd;

}



.search input{

width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;

}



.table-box{

background:white;
padding:20px;
border-radius:20px;
margin-top:20px;
box-shadow:0 5px 15px #ddd;

overflow:auto;

}



table{

width:100%;
border-collapse:collapse;

}



th{

background:#111827;
color:white;
padding:12px;

}



td{

padding:12px;
text-align:center;
border-bottom:1px solid #eee;

}



</style>


</head>


<body>


<div class="container">


<div class="header">

<h1>🚿 سجل الغسلات</h1>

<p>متابعة عمليات الغسيل اليومية</p>

</div>



<div class="cards">


<div class="card">

<h3>🚿 مجموع الغسلات</h3>

<div class="number" id="totalWash">
0
</div>

</div>



<div class="card">

<h3>📅 غسلات اليوم</h3>

<div class="number" id="todayWash">
0
</div>

</div>


</div>



<div class="search">

<input 
id="search"
placeholder="🔍 ابحث بالاسم أو السيارة أو رقم العضوية">

</div>



<div class="table-box">


<table id="washTable">


<tr>

<th>
العضوية
</th>

<th>
الاسم
</th>

<th>
السيارة
</th>

<th>
التاريخ
</th>

<th>
الوقت
</th>

</tr>


</table>


</div>


</div>
<script>


const api =
"https://script.google.com/macros/s/AKfycbyhSUO41n1mWPabPWy0yX3FbUenKBhZgrDONzDVWd3m0YhP_APInJCKJSsXjysNQ2Tn/exec";


let allWashes = [];



async function loadWashes(){


try{


let response = await fetch(
api + "?action=getWashes"
);


let data = await response.json();



if(data.status=="success"){


allWashes = data.washes;


document.getElementById("totalWash").innerHTML =
data.total;



document.getElementById("todayWash").innerHTML =
data.today;



displayWashes(allWashes);



}



}catch(error){


console.log(error);


}


}




function displayWashes(list){


let table =
document.getElementById("washTable");



table.innerHTML = `

<tr>

<th>العضوية</th>

<th>الاسم</th>

<th>السيارة</th>

<th>التاريخ</th>

<th>الوقت</th>

</tr>

`;



list.forEach(function(item){



table.innerHTML += `

<tr>

<td>${item.memberId}</td>

<td>${item.name}</td>

<td>${item.car}</td>

<td>${item.date}</td>

<td>${item.time}</td>

</tr>

`;



});


}




document.getElementById("search")
.addEventListener("keyup",function(){


let value =
this.value.toLowerCase();



let result =
allWashes.filter(function(item){



return (


String(item.memberId)
.toLowerCase()
.includes(value)


||


String(item.name)
.toLowerCase()
.includes(value)


||


String(item.car)
.toLowerCase()
.includes(value)



);



});



displayWashes(result);



});



loadWashes();



</script>


</body>

</html>
